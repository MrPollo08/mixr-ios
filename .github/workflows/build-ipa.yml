name: Build IPA

# Compila MiXR en un runner macOS de GitHub y publica un .ipa sin firmar
# como artifact descargable. No hace falta tener un Mac.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MiXR.xcodeproj \
            -target MiXR \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH="$(find build -maxdepth 5 -name 'MiXR.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No se generó la app. Últimas 200 líneas del log:"
            tail -n 200 xcodebuild.log
            exit 1
          fi
          echo "App compilada en: $APP_PATH"
          rm -rf Payload MiXR.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MiXR.ipa Payload
          ls -lh MiXR.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiXR-ipa
          path: MiXR.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      # Deja los errores del compilador como "annotation" del run: es público y
      # legible sin login, así se puede diagnosticar sin descargar artefactos.
      - name: Publish build errors
        if: failure()
        run: |
          set +e
          python3 - <<'PY'
          import os

          path = "xcodebuild.log"
          if not os.path.exists(path):
              print("::error title=Build::no se generó xcodebuild.log")
              raise SystemExit(0)

          text = open(path, "r", errors="replace").read()
          lines = text.splitlines()
          errors = [line for line in lines if "error:" in line]
          block = errors[-80:] if errors else lines[-80:]
          message = "\n".join(block)[-60000:]
          escaped = message.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=Compilación Swift::" + escaped)
          PY
