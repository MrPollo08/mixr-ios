name: MiXR
options:
  bundleIdPrefix: com.mixr
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  MiXR:
    type: application
    platform: iOS
    sources:
      - path: MiXR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mixr.ios
        PRODUCT_NAME: MiXR
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ONLY_ACTIVE_ARCH: "NO"
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  MiXR:
    build:
      targets:
        MiXR: all
    run:
      config: Debug
    archive:
      config: Release
